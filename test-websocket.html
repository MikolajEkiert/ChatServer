<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat Test</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        input {
            width: 70%;
            padding: 8px;
        }
        button {
            padding: 8px 15px;
            margin-left: 5px;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .connected {
            background: #d4edda;
            color: #155724;
        }
        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>WebSocket Chat Test</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <div id="messages"></div>
    <div>
        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>
    <div style="margin-top: 20px;">
        <p><strong>Server 1:</strong> <button onclick="connectToServer(8080)">Connect to :8080</button></p>
        <p><strong>Server 2:</strong> <button onclick="connectToServer(8081)">Connect to :8081</button></p>
    </div>

    <script>
        let socket = null;
        let currentPort = 8080;

        function connectToServer(port) {
            currentPort = port;
            if (socket && socket.readyState === WebSocket.OPEN) {
                disconnect();
            }
            setTimeout(() => connect(), 100);
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//localhost:${currentPort}/ws`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = function(event) {
                updateStatus('Connected', true);
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                addMessage('System', 'Connected to server on port ' + currentPort);
            };

            socket.onmessage = function(event) {
                addMessage('Server', event.data);
            };

            socket.onclose = function(event) {
                updateStatus('Disconnected', false);
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                addMessage('System', 'Disconnected from server');
            };

            socket.onerror = function(error) {
                addMessage('System', 'Error: ' + error);
            };
        }

        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(message);
                addMessage('You', message);
                input.value = '';
            }
        }

        function addMessage(sender, message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(text, connected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.className = 'status ' + (connected ? 'connected' : 'disconnected');
        }

        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
