name: Start Azure App Service

on:
  schedule:
    # Start pon-pt o 8:00 UTC (9:00 CET, 10:00 CEST)
    - cron: '0 8 * * 1-5'
  
  workflow_dispatch:  # Pozwala ręcznie uruchomić

jobs:
  start-app-service:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Start App Service
        run: |
          echo "Starting App Service: ${{ secrets.AZURE_WEBAPP_NAME }}"
          az webapp start \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RG }}
          echo "✅ App Service started successfully"
      
      - name: Check Status
        run: |
          STATUS=$(az webapp show \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RG }} \
            --query state -o tsv)
          echo "Current status: $STATUS"
      
      - name: Wait for App to be ready
        run: |
          echo "Waiting 60 seconds for app to fully start..."
          sleep 60
          
      - name: Health Check (optional)
        continue-on-error: true
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Checking health endpoint: $URL"
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" $URL || echo "000")
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed"
          else
            echo "⚠️ Health check failed (app may still be starting or require authentication)"
          fi

