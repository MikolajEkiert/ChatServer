services:
  redis:
    image: redis:7-alpine
    container_name: chatserver-redis
    ports:
      - "6379:6379"
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatserver1:
    build:
      context: .
      dockerfile: ChatServer/Dockerfile
    container_name: chatserver-instance-1
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network

  chatserver2:
    build:
      context: .
      dockerfile: ChatServer/Dockerfile
    container_name: chatserver-instance-2
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
